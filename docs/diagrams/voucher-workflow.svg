<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Voucher workflow</title>
<desc>A voucher starts as a draft, is submitted and becomes pending approval, then the Director approves or rejects it.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#57606a"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="299" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="30" cy="150" r="7" fill="#57606a"/>
<path d="M37 150 H68" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="70" y="118" width="140" height="64" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="140.0" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Draft</text>
<text x="140.0" y="164" text-anchor="middle" font-size="12" fill="#57606a">employee can edit</text>
<path d="M210 150 H328" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="269" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">Submit</text>
<text x="269" y="170" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a">signature required</text>
<rect x="330" y="118" width="170" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="415.0" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Pending approval</text>
<text x="415.0" y="164" text-anchor="middle" font-size="12" fill="#57606a">waits for the Director</text>
<path d="M500 150 H590 V80 H678" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M500 150 H590 V220 H678" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="634" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">Approve</text>
<text x="634" y="98" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a">+ signature</text>
<text x="634" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">Reject</text>
<text x="634" y="238" text-anchor="middle" font-size="11" font-weight="400" fill="#57606a">+ reason</text>
<rect x="680" y="48" width="170" height="64" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="765.0" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Approved</text>
<text x="765.0" y="94" text-anchor="middle" font-size="12" fill="#57606a">final, read-only</text>
<rect x="680" y="188" width="170" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="765.0" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Rejected</text>
<text x="765.0" y="234" text-anchor="middle" font-size="12" fill="#57606a">final, reason recorded</text>
<text x="450" y="284" text-anchor="middle" font-size="12" font-weight="400" fill="#57606a">Only the employee who created a voucher can change it, and only while it is a draft.</text>
</svg>
