<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Database schema</title>
<desc>Two tables: users and vouchers. A voucher references the employee who created it and the director who reviewed it, both in the users table.</desc>
<rect x="0.5" y="0.5" width="939" height="539" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="40" y="40" width="260" height="198" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<path d="M40 70 V48 a8 8 0 0 1 8 -8 H292 a8 8 0 0 1 8 8 V70 z" fill="#ddf4ff" stroke="#8c959f" stroke-width="1.5"/>
<text x="52" y="55" font-size="14" font-weight="700" fill="#1f2328" dominant-baseline="central">users</text>
<text x="52" y="82" font-size="12" fill="#1f2328" dominant-baseline="central">id</text>
<text x="145" y="82" font-size="11" font-weight="700" fill="#8250df" dominant-baseline="central">PK</text>
<text x="288" y="82" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">int</text>
<line x1="41" y1="94" x2="299" y2="94" stroke="#eaeef2"/>
<text x="52" y="106" font-size="12" fill="#1f2328" dominant-baseline="central">name</text>
<text x="288" y="106" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">varchar(100)</text>
<line x1="41" y1="118" x2="299" y2="118" stroke="#eaeef2"/>
<text x="52" y="130" font-size="12" fill="#1f2328" dominant-baseline="central">email</text>
<text x="145" y="130" font-size="11" font-weight="700" fill="#0969da" dominant-baseline="central">UK</text>
<text x="288" y="130" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">varchar(150)</text>
<line x1="41" y1="142" x2="299" y2="142" stroke="#eaeef2"/>
<text x="52" y="154" font-size="12" fill="#1f2328" dominant-baseline="central">password_hash</text>
<text x="288" y="154" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">varchar(255)</text>
<line x1="41" y1="166" x2="299" y2="166" stroke="#eaeef2"/>
<text x="52" y="178" font-size="12" fill="#1f2328" dominant-baseline="central">role</text>
<text x="288" y="178" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">enum</text>
<line x1="41" y1="190" x2="299" y2="190" stroke="#eaeef2"/>
<text x="52" y="202" font-size="12" fill="#1f2328" dominant-baseline="central">employee_code</text>
<text x="288" y="202" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">varchar(30)</text>
<line x1="41" y1="214" x2="299" y2="214" stroke="#eaeef2"/>
<text x="52" y="226" font-size="12" fill="#1f2328" dominant-baseline="central">created_at</text>
<text x="288" y="226" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">timestamp</text>
<rect x="520" y="40" width="380" height="462" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<path d="M520 70 V48 a8 8 0 0 1 8 -8 H892 a8 8 0 0 1 8 8 V70 z" fill="#ddf4ff" stroke="#8c959f" stroke-width="1.5"/>
<text x="532" y="55" font-size="14" font-weight="700" fill="#1f2328" dominant-baseline="central">vouchers</text>
<text x="532" y="82" font-size="12" fill="#1f2328" dominant-baseline="central">id</text>
<text x="770" y="82" font-size="11" font-weight="700" fill="#8250df" dominant-baseline="central">PK</text>
<text x="888" y="82" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">int</text>
<line x1="521" y1="94" x2="899" y2="94" stroke="#eaeef2"/>
<text x="532" y="106" font-size="12" fill="#1f2328" dominant-baseline="central">voucher_number</text>
<text x="770" y="106" font-size="11" font-weight="700" fill="#0969da" dominant-baseline="central">UK</text>
<text x="888" y="106" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">varchar(30)</text>
<rect x="521" y="118" width="378" height="24" fill="#fff8c5"/>
<line x1="521" y1="118" x2="899" y2="118" stroke="#eaeef2"/>
<text x="532" y="130" font-size="12" fill="#1f2328" dominant-baseline="central">employee_id</text>
<text x="770" y="130" font-size="11" font-weight="700" fill="#9a6700" dominant-baseline="central">FK</text>
<text x="888" y="130" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">int</text>
<line x1="521" y1="142" x2="899" y2="142" stroke="#eaeef2"/>
<text x="532" y="154" font-size="12" fill="#1f2328" dominant-baseline="central">voucher_date</text>
<text x="888" y="154" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">date</text>
<line x1="521" y1="166" x2="899" y2="166" stroke="#eaeef2"/>
<text x="532" y="178" font-size="12" fill="#1f2328" dominant-baseline="central">expense_date</text>
<text x="888" y="178" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">date</text>
<line x1="521" y1="190" x2="899" y2="190" stroke="#eaeef2"/>
<text x="532" y="202" font-size="12" fill="#1f2328" dominant-baseline="central">department</text>
<text x="888" y="202" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">varchar(100)</text>
<line x1="521" y1="214" x2="899" y2="214" stroke="#eaeef2"/>
<text x="532" y="226" font-size="12" fill="#1f2328" dominant-baseline="central">expense_title</text>
<text x="888" y="226" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">varchar(200)</text>
<line x1="521" y1="238" x2="899" y2="238" stroke="#eaeef2"/>
<text x="532" y="250" font-size="12" fill="#1f2328" dominant-baseline="central">expense_category</text>
<text x="888" y="250" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">varchar(50)</text>
<line x1="521" y1="262" x2="899" y2="262" stroke="#eaeef2"/>
<text x="532" y="274" font-size="12" fill="#1f2328" dominant-baseline="central">expense_description</text>
<text x="888" y="274" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">text</text>
<line x1="521" y1="286" x2="899" y2="286" stroke="#eaeef2"/>
<text x="532" y="298" font-size="12" fill="#1f2328" dominant-baseline="central">amount</text>
<text x="888" y="298" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">decimal(12,2)</text>
<line x1="521" y1="310" x2="899" y2="310" stroke="#eaeef2"/>
<text x="532" y="322" font-size="12" fill="#1f2328" dominant-baseline="central">employee_signature_path</text>
<text x="888" y="322" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">varchar(255)</text>
<line x1="521" y1="334" x2="899" y2="334" stroke="#eaeef2"/>
<text x="532" y="346" font-size="12" fill="#1f2328" dominant-baseline="central">status</text>
<text x="888" y="346" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">enum</text>
<rect x="521" y="358" width="378" height="24" fill="#fff8c5"/>
<line x1="521" y1="358" x2="899" y2="358" stroke="#eaeef2"/>
<text x="532" y="370" font-size="12" fill="#1f2328" dominant-baseline="central">director_id</text>
<text x="770" y="370" font-size="11" font-weight="700" fill="#9a6700" dominant-baseline="central">FK</text>
<text x="888" y="370" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">int</text>
<line x1="521" y1="382" x2="899" y2="382" stroke="#eaeef2"/>
<text x="532" y="394" font-size="12" fill="#1f2328" dominant-baseline="central">director_signature_path</text>
<text x="888" y="394" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">varchar(255)</text>
<line x1="521" y1="406" x2="899" y2="406" stroke="#eaeef2"/>
<text x="532" y="418" font-size="12" fill="#1f2328" dominant-baseline="central">approval_date</text>
<text x="888" y="418" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">datetime</text>
<line x1="521" y1="430" x2="899" y2="430" stroke="#eaeef2"/>
<text x="532" y="442" font-size="12" fill="#1f2328" dominant-baseline="central">rejection_reason</text>
<text x="888" y="442" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">text</text>
<line x1="521" y1="454" x2="899" y2="454" stroke="#eaeef2"/>
<text x="532" y="466" font-size="12" fill="#1f2328" dominant-baseline="central">created_at</text>
<text x="888" y="466" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">timestamp</text>
<line x1="521" y1="478" x2="899" y2="478" stroke="#eaeef2"/>
<text x="532" y="490" font-size="12" fill="#1f2328" dominant-baseline="central">updated_at</text>
<text x="888" y="490" text-anchor="end" font-size="12" fill="#57606a" dominant-baseline="central">timestamp</text>
<path d="M300 82 H400 V130 H520" fill="none" stroke="#57606a" stroke-width="1.5"/>
<path d="M300 82 H360 V370 H520" fill="none" stroke="#57606a" stroke-width="1.5"/>
<circle cx="300" cy="82" r="3.5" fill="#57606a"/>
<text x="312" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">1</text>
<text x="506" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">N</text>
<text x="506" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">N</text>
<text x="458" y="148" text-anchor="middle" font-size="12" font-weight="400" fill="#57606a">creates</text>
<text x="442" y="388" text-anchor="middle" font-size="12" font-weight="400" fill="#57606a">reviews</text>
<text x="40" y="270" text-anchor="start" font-size="12" font-weight="700" fill="#8250df">PK  primary key</text>
<text x="40" y="290" text-anchor="start" font-size="12" font-weight="700" fill="#0969da">UK  unique value</text>
<text x="40" y="310" text-anchor="start" font-size="12" font-weight="700" fill="#9a6700">FK  foreign key, points to users.id</text>
<text x="40" y="350" text-anchor="start" font-size="12" font-weight="400" fill="#57606a">Each voucher belongs to the employee</text>
<text x="40" y="368" text-anchor="start" font-size="12" font-weight="400" fill="#57606a">who created it (employee_id) and, once</text>
<text x="40" y="386" text-anchor="start" font-size="12" font-weight="400" fill="#57606a">reviewed, to the Director who decided</text>
<text x="40" y="404" text-anchor="start" font-size="12" font-weight="400" fill="#57606a">(director_id).</text>
</svg>
